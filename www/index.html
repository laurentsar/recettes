<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a120b" />
<title>Recettes</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="img/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <div id="hero">
      <div>
        <div id="hero-title">🍲 Recettes</div>
        <div id="hero-sub"></div>
      </div>
      <button id="frigo-btn" title="Analyser le frigo" aria-label="Frigo">🧊</button>
      <button id="photos-btn" title="Récupérer photos + titres manquants depuis le lien" aria-label="Photos manquantes">📷</button>
      <button id="import-btn" title="Importer une recette" aria-label="Importer">⬇</button>
      <button id="sync-btn" title="Synchroniser les recettes" aria-label="Synchroniser">↻</button>
    </div>
    <div id="mode-tabs">
      <button class="mode-tab active" data-mode="recipes">🍽️ Recettes</button>
      <button class="mode-tab" data-mode="airfryer">🌪️ Airfryer</button>
      <button class="mode-tab" data-mode="thermomix">⚙️ Thermomix</button>
      <button class="mode-tab" data-mode="cocktails">🍹 Cocktails</button>
      <button class="mode-tab" data-mode="corse">🏝️ Corse</button>
      <button class="mode-tab" data-mode="espagne">🇪🇸 Espagne</button>
      <button class="mode-tab" data-mode="portugal">🇵🇹 Portugal</button>
      <button class="mode-tab" data-mode="italie">🇮🇹 Italie</button>
      <button class="mode-tab" data-mode="japon">🇯🇵 Japon</button>
      <button class="mode-tab" data-mode="asie">🍜 Asie</button>
      <button class="mode-tab" data-mode="maghreb">🫖 Maghreb</button>
    </div>
    <input id="search" type="search" placeholder="Rechercher (titre, ingrédient…)" autocomplete="off" />
    <div id="cats"></div>
  </header>

  <main id="main">
    <div id="daily"></div>
    <div id="status" class="status"></div>
    <div id="grid"></div>
    <div id="cocktail-grid" hidden></div>
  </main>

  <div id="detail" class="detail" hidden></div>
  <div id="cocktail-detail" class="detail" hidden></div>
  <div id="edit" class="editview" hidden></div>
  <div id="ingpick" class="editview" hidden></div>
  <div id="cook" class="cook" hidden></div>
  <div id="frigo" class="frigo" hidden>
    <div class="frigo-head">
      <button class="frigo-head-back" id="frigo-back" aria-label="Retour">←</button>
      <div class="frigo-head-title">🧊 Frigo</div>
    </div>
    <div class="frigo-scroll">
      <div class="frigo-body">
        <details class="frigo-settings" id="frigo-settings">
          <summary>⚙️ Clé API Claude</summary>
          <div class="frigo-api-row">
            <input id="frigo-api-key" type="password" placeholder="sk-ant-..." autocomplete="off" />
            <button id="frigo-api-save" class="frigo-api-save-btn">Enregistrer</button>
          </div>
          <p class="frigo-note">La clé est stockée localement sur l'appareil. Modèle : claude-haiku-4-5.</p>
        </details>
        <label class="frigo-capture-btn" for="frigo-file-input">📷 Photographier le frigo</label>
        <input type="file" id="frigo-file-input" class="frigo-file-hidden" accept="image/*" capture="environment">
        <div id="frigo-status"></div>
        <div id="frigo-ings" hidden></div>
        <div id="frigo-grid" hidden></div>
      </div>
    </div>
  </div>
  <div id="catpick" class="catpick-modal" hidden></div>
  <div id="import" class="editview" hidden></div>
  <div id="toast" class="toast" hidden></div>

<details id="backup-details" style="margin:16px auto;max-width:900px;padding:0 12px">
  <summary style="cursor:pointer;font-weight:600;padding:8px 0">💾 Sauvegarde des données</summary>
  <p style="font-size:13px;opacity:.8">Tes données vivent sur ce téléphone : désinstaller l'app
  les efface. Renseigne Home Assistant ci-dessous et la sauvegarde devient automatique.</p>
  <div id="backup-panel"></div>
</details>

  <script src="app.js"></script>
  <script>window.UPDATE_REPO='laurentsar/recettes';window.APP_VERSION='2.28';</script>
  <script src="update-check.js" defer></script>
  <script>window.BACKUP_APP = 'recettes-app'; window.BACKUP_SKIP = [/^recipesData$/];</script>
  <script src="autobackup.js"></script>
  <script>AutoBackup.mount(document.getElementById('backup-panel'));</script>
</body>
</html>
